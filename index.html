<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine? 💕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            width: 100%;
            max-width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            padding: 40px 20px;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .hearts-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .heart-float {
            position: absolute;
            font-size: 20px;
            opacity: 0.5;
            animation: float 15s infinite;
            filter: drop-shadow(0 2px 8px rgba(255, 255, 255, 0.3));
        }

        .letter-btn {
            display: inline-block;
            padding: 18px 45px;
            font-size: 1.5em;
            font-weight: 700;
            color: white;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 50px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: 3px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.5;
            }

            90% {
                opacity: 0.5;
            }

            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 90%;
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 50px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3),
                inset 0 0 40px rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .cat-image {
            width: 250px;
            height: 250px;
            margin: 0 auto 30px;
            animation: float-cat 3s ease-in-out infinite;
            filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.4));
            transition: opacity 0.3s ease-in-out;
            opacity: 1;
            border-radius: 20px;
            border: 4px solid rgba(255, 255, 255, 0.3);
        }

        @keyframes float-cat {

            0%,
            100% {
                transform: translateY(0px) rotate(-2deg);
            }

            50% {
                transform: translateY(-20px) rotate(2deg);
            }
        }

        h2 {
            color: #ffffff;
            font-size: 36px;
            margin-bottom: 50px;
            text-shadow: 2px 2px 20px rgba(102, 126, 234, 0.8),
                -2px -2px 20px rgba(244, 147, 251, 0.8);
            font-weight: 700;
            transition: opacity 0.3s ease-in-out;
            opacity: 1;
            letter-spacing: 1px;
        }

        .buttons-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
            margin-top: 40px;
            position: relative;
            min-height: 80px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.4em;
            font-weight: 400;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            position: relative;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 20px;
        }

        .yes-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: 3px solid rgba(255, 255, 255, 0.4);
        }

        .yes-btn:hover {
            transform: scale(1.15) translateY(-3px);
            box-shadow: 0 12px 35px rgba(245, 87, 108, 0.6),
                0 0 30px rgba(240, 147, 251, 0.4);
        }

        .no-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transition: none;
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        .no-btn:hover {
            transform: scale(1.08) translateY(-2px);
        }

        .success-message {
            display: none;
            animation: fadeIn 0.5s ease-in;
        }

        .success-message h2 {
            color: #ffffff;
            font-size: 3em;
            margin: 20px 0;
            text-shadow: 2px 2px 20px rgba(102, 126, 234, 0.8),
                -2px -2px 20px rgba(244, 147, 251, 0.8);
        }

        .success-message p {
            color: #ffffff;
            font-size: 1.5em;
            font-weight: bold;
            text-shadow: 2px 2px 15px rgba(102, 126, 234, 0.6);
        }

        .emoji {
            font-size: 5em;
            margin: 20px 0;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            10%,
            30% {
                transform: scale(1.2);
            }

            20%,
            40% {
                transform: scale(1);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.8) translateY(30px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .confetti {
            position: fixed;
            width: 12px;
            height: 12px;
            pointer-events: none;
            z-index: 9999;
            border-radius: 50%;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(720deg);
            }
        }

        .sparkle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
            animation: sparkle 2s ease-out forwards;
        }

        @keyframes sparkle {
            0% {
                opacity: 1;
                transform: scale(0);
            }

            50% {
                opacity: 1;
                transform: scale(1);
            }

            100% {
                opacity: 0;
                transform: scale(0);
            }
        }


        .yes-btn::before {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            opacity: 0;
            z-index: -1;
            transition: opacity 0.3s ease;
            filter: blur(15px);
        }

        .yes-btn:hover::before {
            opacity: 0.6;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }
    </style>
</head>

<body>
    <div class="hearts-background" id="heartsBackground"></div>

    <div class="container">
        <div id="questionSection">
            <img class="cat-image" src="./image/valentine.jpg">

            <h2 class="valentine_word">Will You Be My Valentine Forever?</h2>

            <div class="buttons-container">
                <button class="yes-btn" onclick="handleYes()">Yes! 💕</button>
                <button class="no-btn" id="noBtn" onclick="handleNo()">No</button>
            </div>
        </div>

        <div class="success-message" id="successMessage">
            <img src="./image/Success.jpg" class="cat-image">
            <h2 style="margin-top: 0px;">Valentine Status: Secured!</h2>
            <a href="https://drive.google.com/file/d/1ZXeiXoYo2FnBw4U1Lt6EC-BqBWN6pUyL/view?usp=sharing"
                class="letter-btn" target="_blank">
                LETTER FOR YOU
            </a>

        </div>
    </div>

    <script>
        let previousIndex = null;
        let indic = 1;

        function createFloatingHearts() {
            const heartsBackground = document.getElementById('heartsBackground');
            const images = ['animal.png', 'cat.png', 'hamster.png', 'kitty.png', 'panda.png', 'teddy-bear.png'];

            for (let i = 0; i < 20; i++) {
                const img = document.createElement('img');
                img.className = 'heart-float';

                img.src = "./animals/" + images[Math.floor(Math.random() * images.length)];

                img.style.left = Math.random() * 100 + '%';
                img.style.animationDelay = Math.random() * 15 + 's';
                img.style.width = (Math.random() * 50 + 35) + 'px';

                heartsBackground.appendChild(img);
            }
        }

        createFloatingHearts();


        document.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.9) {
                createSparkle(e.clientX, e.clientY);
            }
        });

        function createSparkle(x, y) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.style.left = x + 'px';
            sparkle.style.top = y + 'px';
            document.body.appendChild(sparkle);

            setTimeout(() => {
                sparkle.remove();
            }, 2000);
        }

        function handleNo() {

            const catimage = document.querySelector(".cat-image");
            const arrayOfImages = [
                "bearhead.jpg",
                "bigsmile.jpg",
                "BL.jpg",
                "cooking.jpg",
                "crimescene.jpg",
                "darkpic.jpg",
                "eating.jpg",
                "elementary.jpg",
                "emoji.jpg",
                "jacket.jpg",
                "money.jpg",
                "sad.jpg",
                "sleeping.jpg",
                "slicing.jpg",
                "temple.jpg",
                "twokids.jpg",
                "xmark.jpg",
                "zoom.jpg"
            ];

            let randomIndex = Math.floor(Math.random() * arrayOfImages.length);
            while (randomIndex == previousIndex) {
                randomIndex = Math.floor(Math.random() * arrayOfImages.length);
            }
            previousIndex = randomIndex;

            const randomImage = arrayOfImages[randomIndex];

            const imagePhrases = [
                "Cute bear 🧸🧸",
                "Dakog smile haaa",
                "Cge, no pa kay kami nalang duwa 😔",
                "Tan-aw sa gi luto, dili sa ako-a",
                "Mura mag crime scene",
                "Ni black na ka diri",
                "Hmm sarap ng kina-in ha",
                "Cutieee yieeeee",
                "😝😝😝😝",
                "Mag jacket nalang ko, ka cold man nimo 😔",
                "I have no words for this",
                "Sure na juddd?",
                "Pukawa nako kung pili-on nako nimo",
                "Murag scripted ni HAHAHA",
                "Psst sirad-i nina, ayaw pangawat",
                "No ka? kay sumbagon tika 👊",
                "Ekis kana",
                "Gi zoom nako imong nawng"
            ];

            const valentine_word = document.querySelector(".valentine_word");

            catimage.style.opacity = 0;
            valentine_word.style.opacity = 0;

            setTimeout(() => {
                catimage.src = `./noimages/${randomImage}`;
                valentine_word.textContent = imagePhrases[randomIndex];
                catimage.style.opacity = 1;
                valentine_word.style.opacity = 1;
            }, 300);
        }

        function handleYes() {
            document.getElementById('questionSection').style.display = 'none';
            document.getElementById('successMessage').style.display = 'block';
            createConfetti();
        }

        function createConfetti() {
            const colors = ['#ff6b6b', '#ee5a6f', '#f06595', '#cc5de8', '#845ef7', '#5c7cfa', '#339af0', '#22b8cf', '#20c997', '#51cf66', '#94d82d', '#ffd43b', '#ff922b', '#ffffff'];
            const confettiCount = 200;

            for (let i = 0; i < confettiCount; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = '-10px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animation = `confetti-fall ${Math.random() * 3 + 2}s linear forwards`;
                    confetti.style.opacity = Math.random() * 0.5 + 0.5;

                    document.body.appendChild(confetti);

                    setTimeout(() => {
                        confetti.remove();
                    }, 5000);
                }, i * 8);
            }
        }
    </script>
</body>

</html>
